[project]
name = "sih-voice-agent"
version = "0.1.0"
description = "A small LiveKit voice agent powered by OpenAI and Sarvam AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,sarvam,silero]~=1.8",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
